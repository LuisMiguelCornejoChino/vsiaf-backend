spring.application.name=vsiaf-backend

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

# Base de datos (en Render se definen como variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vsiaf}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update = crea/actualiza las tablas estado y respaldo automáticamente
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://jdka-suburbio.github.io}
